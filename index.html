<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Australia Population Quest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ocean: "#0b74b8",
              reef: "#0f9f8f",
              gum: "#2f7d32",
              sand: "#f1dfb8",
              paper: "#fffdf7",
              ink: "#1b2b34"
            },
            boxShadow: {
              classroom: "0 14px 36px rgba(16, 48, 64, 0.14)"
            },
            keyframes: {
              lift: {
                "0%, 100%": { transform: "translateY(0)" },
                "50%": { transform: "translateY(-4px)" }
              },
              pop: {
                "0%": { transform: "scale(0.96)", opacity: "0.5" },
                "100%": { transform: "scale(1)", opacity: "1" }
              }
            },
            animation: {
              lift: "lift 2.8s ease-in-out infinite",
              pop: "pop 180ms ease-out"
            }
          }
        }
      };
    </script>
    <style>
      :root {
        color-scheme: light;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background:
          linear-gradient(90deg, rgba(15, 159, 143, 0.08) 1px, transparent 1px),
          linear-gradient(rgba(11, 116, 184, 0.07) 1px, transparent 1px),
          #f8f3e5;
        background-size: 34px 34px;
        color: #1b2b34;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .quest-card {
        border: 1px solid rgba(27, 43, 52, 0.12);
        border-radius: 8px;
        background: rgba(255, 253, 247, 0.96);
        box-shadow: 0 14px 36px rgba(16, 48, 64, 0.11);
      }

      .soft-panel {
        border: 1px solid rgba(27, 43, 52, 0.1);
        border-radius: 8px;
        background: rgba(255, 253, 247, 0.72);
      }

      .australia-map-shell {
        position: relative;
        overflow: hidden;
        border-radius: 8px;
        background:
          radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.92), transparent 20%),
          linear-gradient(150deg, rgba(11, 116, 184, 0.16), rgba(15, 159, 143, 0.1) 42%, rgba(241, 223, 184, 0.44));
        min-height: 520px;
      }

      .australia-map-shell.compact {
        min-height: 430px;
      }

      .australia-map {
        display: block;
        width: 100%;
        height: auto;
        min-height: 420px;
      }

      .map-region {
        cursor: pointer;
        outline: none;
      }

      .map-region path {
        fill: var(--region-fill);
        stroke: rgba(255, 253, 247, 0.98);
        stroke-width: 5;
        stroke-linejoin: round;
        stroke-linecap: round;
        filter: drop-shadow(0 8px 12px rgba(16, 48, 64, 0.16));
        transition: filter 160ms ease, opacity 160ms ease, transform 160ms ease;
      }

      .map-region:hover path,
      .map-region:focus-visible path {
        filter: drop-shadow(0 14px 18px rgba(16, 48, 64, 0.24));
        opacity: 0.94;
        transform: translateY(-3px);
      }

      .map-region.selected path {
        stroke: #fffdf7;
        stroke-width: 8;
        filter: drop-shadow(0 0 0 rgba(0, 0, 0, 0)) drop-shadow(0 0 16px rgba(11, 116, 184, 0.82));
      }

      .map-region-label,
      .map-region-population {
        pointer-events: none;
        paint-order: stroke;
        stroke: rgba(0, 0, 0, 0.26);
        stroke-width: 3px;
        stroke-linejoin: round;
        fill: #ffffff;
      }

      .map-region-label {
        font-size: 28px;
        font-weight: 900;
      }

      .map-region-population {
        font-size: 15px;
        font-weight: 800;
      }

      .map-region-badge {
        pointer-events: none;
        fill: rgba(255, 255, 255, 0.19);
        stroke: rgba(255, 255, 255, 0.34);
        stroke-width: 1;
      }

      .map-info-label,
      .map-compact-label {
        color: #ffffff;
        font-weight: 900;
        line-height: 1.08;
        pointer-events: none;
        text-shadow: 0 2px 8px rgba(27, 43, 52, 0.38);
      }

      .map-info-label .map-code {
        font-size: 42px;
        letter-spacing: 0;
      }

      .map-info-label .map-name {
        font-size: 17px;
        margin-top: 2px;
      }

      .map-info-label .map-stat {
        align-items: baseline;
        display: flex;
        gap: 7px;
        font-size: 14px;
        margin-top: 8px;
        white-space: nowrap;
      }

      .map-info-label .map-stat-label {
        background: rgba(255, 255, 255, 0.22);
        border-radius: 8px;
        font-size: 10px;
        padding: 2px 5px;
        text-transform: uppercase;
      }

      .map-compact-label {
        text-align: center;
      }

      .map-compact-label .map-code {
        font-size: 28px;
      }

      .map-compact-label .map-pop {
        font-size: 12px;
      }

      .map-callout-line {
        fill: none;
        stroke: var(--region-fill);
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2.4;
      }

      .map-info-label.callout {
        color: #1b2b34;
        text-shadow: none;
      }

      .map-info-label.callout .map-code {
        color: var(--region-fill);
        font-size: 30px;
      }

      .map-info-label.callout .map-name,
      .map-info-label.callout .map-stat {
        color: #1b2b34;
        font-size: 13px;
      }

      .map-info-label.callout .map-stat-label {
        background: rgba(27, 43, 52, 0.08);
      }

      .map-token-stack {
        align-items: center;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        justify-content: center;
        pointer-events: none;
      }

      .map-token-stack span {
        background: #fffdf7;
        border: 1px solid rgba(27, 43, 52, 0.13);
        border-radius: 8px;
        box-shadow: 0 6px 12px rgba(16, 48, 64, 0.14);
        color: #1b2b34;
        font-size: 12px;
        font-weight: 900;
        line-height: 1.15;
        max-width: 100%;
        padding: 4px 6px;
        text-align: center;
      }

      @media (max-width: 760px) {
        .australia-map-shell {
          min-height: 360px;
        }

        .australia-map {
          min-height: 340px;
        }

        .map-region-label {
          font-size: 24px;
        }

        .map-region-population {
          display: none;
        }

        .map-token-stack span {
          font-size: 10px;
          padding: 3px 5px;
        }
      }

      .drag-token {
        touch-action: manipulation;
        user-select: none;
      }

      .progress-fill {
        transition: width 260ms ease;
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Australia Population Quest needs JavaScript enabled.
    </noscript>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel" data-presets="react" src="./src/data.js"></script>
    <script type="text/babel" data-presets="react" src="./src/App.jsx"></script>
  </body>
</html>
